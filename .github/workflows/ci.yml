name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_NDK_VERSION: 27.2.12479018

jobs:
  # ---------------------------------------------------------------------------------------------
  runner:
    name: Native runner (host tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zlib1g-dev
      - name: Build the runner
        run: make -C runner
      - name: Run the runner and LuaRocks tests
        run: make -C runner test

  # ---------------------------------------------------------------------------------------------
  android:
    name: Android build, unit tests, APK checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Android SDK packages
        shell: bash
        run: scripts/ci-setup-android.sh
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, debug and release builds
        shell: bash
        run: |
          ./gradlew --no-daemon --stacktrace --console=plain \
            :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease \
            :client-example:assembleDebug :client-example:assembleRelease :ipc-api:assembleRelease
      - name: Verify the APKs
        shell: bash
        run: |
          scripts/verify-apk.sh app/build/outputs/apk/debug/app-debug.apk debug
          scripts/verify-apk.sh app/build/outputs/apk/release/app-release.apk release

  # ---------------------------------------------------------------------------------------------
  emulator:
    name: Acceptance tests (Android 14 emulator, two apps)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Android SDK packages
        shell: bash
        run: scripts/ci-setup-android.sh
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the acceptance tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash scripts/ci-emulator-tests.sh
      - name: Upload screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-results
          path: |
            screenshots/
            logcat.txt
            gradle-emulator.log
            client-example/build/reports/androidTests/
            app/build/reports/androidTests/
          if-no-files-found: ignore
          retention-days: 14
